# ============================================================
# Kitty configuration
# VS Code Dark by default; manual light and Gruvbox switching
# ============================================================

# Default theme on startup
include ~/.config/kitty/VSCode_Dark.conf

# ============================================================
# Font
# ============================================================

font_family      JetBrainsMono Nerd Font Mono
font_size        11.0

# ============================================================
# Layout and pane appearance
# ============================================================

enabled_layouts splits

window_border_width      1.5pt
draw_minimal_borders     yes
window_margin_width      0
window_padding_width     0

# Keep the VS Code palette, with a blue active-pane border
active_border_color      #3b8eea
inactive_border_color    #414140
inactive_text_alpha      0.55

# ============================================================
# Splits and tabs: Ctrl+Shift on Linux and macOS
# split_local.py opens a local shell even when the current
# terminal is connected to a remote host over SSH.
# ============================================================

# Create splits and tabs
map ctrl+shift+p kitten split_local.py --location=vsplit
map ctrl+shift+o kitten split_local.py --location=hsplit
map ctrl+shift+t kitten split_local.py --type=tab

# Navigate between panes
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Resize panes
map ctrl+shift+alt+h resize_window narrower 5
map ctrl+shift+alt+l resize_window wider 5
map ctrl+shift+alt+k resize_window shorter 5
map ctrl+shift+alt+j resize_window taller 5

# Close the active pane
map ctrl+shift+w close_window

# ============================================================
# Tabs: keep core workflow consistent across platforms
# ============================================================

map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
map ctrl+shift+alt+] move_tab_forward
map ctrl+shift+alt+[ move_tab_backward

# Manual theme switching
map ctrl+shift+1 set_colors ~/.config/kitty/VSCode_Dark.conf
map ctrl+shift+2 set_colors ~/.config/kitty/day.conf
map ctrl+shift+3 set_colors ~/.config/kitty/gruvbox-dark-hard.conf

# Direct tab selection (Alt keeps these distinct from theme switching)
map ctrl+shift+alt+1 goto_tab 1
map ctrl+shift+alt+2 goto_tab 2
map ctrl+shift+alt+3 goto_tab 3
map ctrl+shift+alt+4 goto_tab 4
map ctrl+shift+alt+5 goto_tab 5
map ctrl+shift+alt+6 goto_tab 6
map ctrl+shift+alt+7 goto_tab 7
map ctrl+shift+alt+8 goto_tab 8
map ctrl+shift+alt+9 goto_tab 9

# Rename current tab
map ctrl+shift+r set_tab_title

# ============================================================
# Cursor
# ============================================================

cursor_trail 3
cursor_blink_interval 0

# ============================================================
# Scrollback, shell integration, and text handling
# ============================================================

scrollback_lines -1
shell_integration enabled
strip_trailing_spaces smart
copy_on_select no

# ============================================================
# Tab bar and notifications
# ============================================================

tab_bar_style powerline
tab_title_template "{bell_symbol}{index}: {title}"
bell_on_tab "● "
enable_audio_bell no

# ============================================================
# URL handling and terminal behavior
# ============================================================

detect_urls yes
open_url_with default
wrap_lines yes

# ============================================================
# Remote control for Kitty integrations (e.g. Neovim tools)
# ============================================================

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# ============================================================
# Window behavior and macOS integration
# ============================================================

confirm_os_window_close 1
macos_option_as_alt yes
